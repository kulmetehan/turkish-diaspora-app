<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Turkspot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 500px;
      width: 100%;
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      opacity: 0.8;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #cccccc;
      margin-bottom: 32px;
    }
    
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, opacity 0.2s;
      cursor: pointer;
      border: none;
    }
    
    .button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }
    
    .button:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 24px;
      padding: 12px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Geen internetverbinding</h1>
    <p>
      Je bent momenteel offline. Controleer je internetverbinding en probeer het opnieuw.
    </p>
    <button class="button" onclick="window.location.reload()">
      Opnieuw proberen
    </button>
    <div class="status" id="status">
      Wachten op verbinding...
    </div>
  </div>
  
  <script>
    // Check online status
    function updateStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.textContent = 'Verbonden! De pagina wordt herladen...';
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      } else {
        statusEl.textContent = 'Geen verbinding';
      }
    }
    
    // Listen for online/offline events
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);
    
    // Initial status check
    updateStatus();
    
    // Periodic check (every 5 seconds)
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
